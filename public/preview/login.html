<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Target Portal · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{
  --ink: oklch(24% 0.03 260);
  --muted: oklch(46% 0.02 260);
  --surface: oklch(98.5% 0.004 260);
  --panel: oklch(100% 0 0);
  --line: oklch(84% 0.012 260);
  --brand: oklch(42% 0.15 262);
  --brand-hover: oklch(37% 0.15 262);
  --brand-deep: oklch(22% 0.08 262);
  --brand-ink: oklch(97% 0.01 262);
  --seg-1: oklch(62% 0.14 258);
  --seg-2: oklch(72% 0.12 252);
  --seg-3: oklch(81% 0.09 248);
  --seg-4: oklch(89% 0.05 245);
  --accent: oklch(84% 0.15 85);
  --danger: oklch(50% 0.19 27);
  --focus: oklch(60% 0.17 262);
  --radius: 10px;
  --display: "Plus Jakarta Sans", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --body: "Plus Jakarta Sans", "IBM Plex Sans Arabic", system-ui, sans-serif;
}
html[dir=rtl]{
  --display: "IBM Plex Sans Arabic", "Plus Jakarta Sans", system-ui, sans-serif;
  --body: "IBM Plex Sans Arabic", "Plus Jakarta Sans", system-ui, sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--body);font-size:15px;line-height:1.5;color:var(--ink);background:var(--surface);-webkit-font-smoothing:antialiased}
::selection{background:oklch(84% 0.08 255);color:var(--brand-deep)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}

.banner{background:oklch(96% 0.05 85);color:oklch(40% 0.1 70);text-align:center;font-size:12px;padding:6px 16px}

.shell{min-height:calc(100vh - 28px);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}

/* ---------- brand panel ---------- */
.brand{position:relative;isolation:isolate;overflow:hidden;background:var(--brand-deep);color:var(--brand-ink);
  padding:clamp(28px,4vw,56px) clamp(24px,5vw,80px);display:flex;flex-direction:column;gap:clamp(28px,5vh,52px)}
.brand::before{content:"";position:absolute;inset:0;z-index:-1;
  background-image:linear-gradient(oklch(100% 0 0 / .06) 1px,transparent 1px),linear-gradient(90deg,oklch(100% 0 0 / .06) 1px,transparent 1px);
  background-size:44px 44px;mask-image:linear-gradient(160deg,#000 15%,transparent 75%)}
.logo{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em}
.logo svg{width:32px;height:32px;color:var(--accent);flex:none}
.brand-title{font-family:var(--display);font-weight:800;font-size:clamp(30px,3.6vw,46px);line-height:1.08;letter-spacing:-.03em;margin:0;max-width:16ch;text-wrap:balance}
.hero-sub{margin:16px 0 0;max-width:42ch;color:oklch(86% 0.03 262);font-size:16px}

.split{margin:0;max-width:560px}
.split-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:14px;color:oklch(86% 0.03 262)}
.split-total{font-family:var(--display);font-weight:700;font-size:24px;color:var(--brand-ink);font-variant-numeric:tabular-nums}
.split-total small{font-size:13px;font-weight:500;color:oklch(80% 0.04 262)}
.bar{display:flex;height:48px;margin-top:14px;border-radius:10px;overflow:hidden;background:oklch(100% 0 0 / .06)}
.seg{flex-basis:0;min-width:0;border-inline-start:2px solid var(--brand-deep);transform-origin:left center}
.seg:first-child{border-inline-start:0}
html[dir=rtl] .seg{transform-origin:right center}
.s1{background:var(--seg-1)}.s2{background:var(--seg-2)}.s3{background:var(--seg-3)}.s4{background:var(--seg-4)}
.legend{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;font-variant-numeric:tabular-nums}
.legend li{display:flex;flex-direction:column;gap:2px;font-size:13px}
.legend .rt{display:flex;align-items:center;gap:6px;color:oklch(82% 0.04 262)}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .lv{font-weight:700;font-size:15px;color:var(--brand-ink)}
.sum{display:flex;align-items:center;gap:8px;margin:16px 0 0;font-size:14px;color:oklch(90% 0.03 262)}
.sum svg{width:20px;height:20px;flex:none}
.sum .ring{fill:none;stroke:var(--accent);stroke-width:1.6}
.sum .tick{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:0}

.rules{list-style:none;margin:0;padding:0;max-width:560px;color:oklch(88% 0.03 262)}
.rules li{position:relative;padding-block:12px;padding-inline-start:22px;border-top:1px solid oklch(100% 0 0 / .12)}
.rules li::before{content:"";position:absolute;inset-inline-start:0;top:19px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.brand-foot{margin:auto 0 0;font-size:13px;color:oklch(78% 0.04 262)}

/* ---------- form panel ---------- */
.auth{display:flex;flex-direction:column;padding:clamp(20px,3.5vw,44px) clamp(24px,5vw,72px);background:var(--panel)}
.auth-top{display:flex;justify-content:flex-end}
html[dir=rtl] .auth-top{justify-content:flex-start}
.lang{font:inherit;font-size:14px;font-weight:600;color:var(--brand);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;transition:background-color .2s,border-color .2s}
.lang:hover{background:oklch(96% 0.02 262);border-color:oklch(78% 0.05 262)}
.auth-body{margin:auto 0;width:100%;max-width:380px;align-self:center}
.title{font-family:var(--display);font-weight:800;font-size:clamp(28px,3vw,34px);letter-spacing:-.025em;line-height:1.1;margin:0}
.lede{margin:10px 0 28px;color:var(--muted)}

.field{margin-bottom:18px}
.field label{display:block;margin-bottom:6px;font-size:14px;font-weight:600}
.ctl{position:relative}
.ctl input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);padding-block:12px;padding-inline:42px 14px;
  caret-color:var(--brand);transition:border-color .2s,box-shadow .2s}
.ctl input[type=password],.ctl input#pass{padding-inline-end:76px}
.ctl input::placeholder{color:oklch(52% 0.015 260)}
.ctl input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px oklch(60% 0.17 262 / .18)}
.field.bad input{border-color:var(--danger);box-shadow:0 0 0 4px oklch(50% 0.19 27 / .12)}
.ico{position:absolute;inset-inline-start:14px;top:50%;translate:0 -50%;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.reveal{position:absolute;inset-inline-end:8px;top:50%;translate:0 -50%;font:inherit;font-size:13px;font-weight:600;color:var(--brand);background:none;border:0;border-radius:6px;padding:6px 8px;cursor:pointer}
.reveal:hover{background:oklch(96% 0.02 262)}
.err{margin:6px 0 0;font-size:13px;color:var(--danger)}
.err:empty{display:none}

.submit{position:relative;width:100%;margin-top:6px;font:inherit;font-weight:700;font-size:16px;color:var(--brand-ink);background:var(--brand);border:0;border-radius:var(--radius);padding:14px 18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background-color .2s,transform .15s}
.submit:hover{background:var(--brand-hover)}
.submit:active{transform:translateY(1px)}
.submit:disabled{cursor:progress}
.spin{display:none;width:16px;height:16px;border-radius:50%;border:2px solid oklch(100% 0 0 / .35);border-top-color:#fff;animation:spin .8s linear infinite}
.submit.loading .spin{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

.notice{margin:14px 0 0;padding:10px 12px;border-radius:8px;font-size:14px;color:var(--brand-deep);background:oklch(96% 0.02 262)}
.notice:empty{display:none}
.help{margin:22px 0 0;font-size:13px;color:var(--muted)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .brand{padding-block:32px}
  .rules,.brand-foot{display:none}
}
@media (max-width:560px){
  .legend{grid-template-columns:repeat(2,minmax(0,1fr))}
  .auth{padding:20px}
}
@media (prefers-reduced-motion:reduce){
  .spin{animation-duration:2.4s}
}
</style>
</head>
<body>
<div class="banner" data-i="banner"></div>

<div class="shell">
  <section class="brand" aria-labelledby="brandTitle">
    <div class="logo">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect x="2" y="5" width="28" height="6" rx="3" fill="currentColor" opacity=".55"/>
        <rect x="2" y="13" width="20" height="6" rx="3" fill="currentColor" opacity=".8"/>
        <rect x="2" y="21" width="12" height="6" rx="3" fill="currentColor"/>
      </svg>
      <span data-i="brand"></span>
    </div>

    <div>
      <h2 id="brandTitle" class="brand-title" data-i="heroTitle"></h2>
      <p class="hero-sub" data-i="heroSub"></p>
    </div>

    <figure class="split">
      <div class="split-head">
        <span data-i="splitName"></span>
        <span class="split-total"><span id="totalNum">27,500</span> <small data-i="cases"></small></span>
      </div>
      <div class="bar" role="img" aria-label="Four route shares: 5,015, 8,234, 6,278 and 7,973 cases, totalling 27,500">
        <span class="seg s1" style="flex-grow:5015"></span>
        <span class="seg s2" style="flex-grow:8234"></span>
        <span class="seg s3" style="flex-grow:6278"></span>
        <span class="seg s4" style="flex-grow:7973"></span>
      </div>
      <ul class="legend">
        <li><span class="rt"><span class="sw s1"></span>314023</span><span class="lv">5,015</span></li>
        <li><span class="rt"><span class="sw s2"></span>314075</span><span class="lv">8,234</span></li>
        <li><span class="rt"><span class="sw s3"></span>314052</span><span class="lv">6,278</span></li>
        <li><span class="rt"><span class="sw s4"></span>314062</span><span class="lv">7,973</span></li>
      </ul>
      <figcaption class="sum">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <circle class="ring" cx="10" cy="10" r="8.5"/>
          <path class="tick" d="M6 10.5l2.7 2.6L14 7.6"/>
        </svg>
        <span data-i="sumOk"></span>
      </figcaption>
    </figure>

    <ul class="rules">
      <li data-i="rule1"></li>
      <li data-i="rule2"></li>
      <li data-i="rule3"></li>
    </ul>

    <p class="brand-foot" data-i="brandFoot"></p>
  </section>

  <main class="auth">
    <div class="auth-top">
      <button class="lang" id="lang" type="button"></button>
    </div>

    <div class="auth-body form-part">
      <h1 class="title" data-i="title"></h1>
      <p class="lede" data-i="lede"></p>

      <form id="form" novalidate>
        <div class="field" id="fUser">
          <label for="user" data-i="userLbl"></label>
          <div class="ctl">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
            <input id="user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false">
          </div>
          <p class="err" id="userErr" aria-live="polite"></p>
        </div>

        <div class="field" id="fPass">
          <label for="pass" data-i="passLbl"></label>
          <div class="ctl">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <input id="pass" name="password" type="password" autocomplete="current-password">
            <button class="reveal" id="reveal" type="button" aria-pressed="false" aria-controls="pass"></button>
          </div>
          <p class="err" id="passErr" aria-live="polite"></p>
        </div>

        <button class="submit" id="submit" type="submit" aria-busy="false">
          <span class="spin" aria-hidden="true"></span>
          <span id="submitLbl"></span>
        </button>
        <p class="notice" id="notice" role="status"></p>
      </form>

      <p class="help" data-i="help"></p>
    </div>
  </main>
</div>

<script>
const STR = {
  en: {
    pageTitle: "Target Portal · Sign in",
    banner: "Mockup only. Sign-in is not connected to a server yet.",
    brand: "Target Portal",
    heroTitle: "Targets that always add up.",
    heroSub: "Each team's share of the monthly total, adjusted inside a fixed limit and never drifting from the total.",
    splitName: "CSD · PET 1 L · October 2026",
    cases: "cases",
    sumOk: "The shares add up to the locked total",
    rule1: "Every pack must still add up to its locked target.",
    rule2: "No one moves more than the cap in a single pack.",
    rule3: "Targets move down from the top, one level at a time.",
    brandFoot: "Monthly sales targets, in cases",
    title: "Sign in",
    lede: "Use the username your administrator created for you.",
    userLbl: "Username", userPh: "e.g. s01.supervisor", errUser: "Enter your username.",
    passLbl: "Password", errPass: "Enter your password.", show: "Show", hide: "Hide",
    submit: "Sign in", busy: "Signing in…",
    notice: "Mockup: sign-in will connect to the server once the back end is built.",
    help: "Accounts are created by your administrator. If you cannot sign in, ask them to reset your password.",
    langBtn: "العربية"
  },
  ar: {
    pageTitle: "بوابة الأهداف · تسجيل الدخول",
    banner: "نموذج تجريبي فقط. تسجيل الدخول غير متصل بالخادم بعد.",
    brand: "بوابة الأهداف",
    heroTitle: "أهداف تتطابق مع إجماليها دائمًا.",
    heroSub: "حصة كل فريق من الإجمالي الشهري، تُعدَّل ضمن حدّ ثابت ولا تنحرف عن الإجمالي.",
    splitName: "CSD · PET 1 L · أكتوبر 2026",
    cases: "كرتون",
    sumOk: "الحصص تساوي الإجمالي المقفل",
    rule1: "يجب أن يبقى مجموع كل عبوة مساويًا لهدفها المقفل.",
    rule2: "لا يُنقل أي مندوب أكثر من الحد المسموح في العبوة الواحدة.",
    rule3: "تنتقل الأهداف من الأعلى إلى الأسفل، مستوى بعد مستوى.",
    brandFoot: "أهداف المبيعات الشهرية بالكراتين",
    title: "تسجيل الدخول",
    lede: "استخدم اسم المستخدم الذي أنشأه لك مسؤول النظام.",
    userLbl: "اسم المستخدم", userPh: "مثال: s01.supervisor", errUser: "أدخل اسم المستخدم.",
    passLbl: "كلمة المرور", errPass: "أدخل كلمة المرور.", show: "إظهار", hide: "إخفاء",
    submit: "تسجيل الدخول", busy: "جارٍ تسجيل الدخول…",
    notice: "نموذج: سيتصل تسجيل الدخول بالخادم بعد بناء الواجهة الخلفية.",
    help: "يُنشئ مسؤول النظام الحسابات. إذا تعذّر عليك الدخول فاطلب منه إعادة تعيين كلمة المرور.",
    langBtn: "English"
  }
};

const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const GS = typeof gsap !== "undefined" && !REDUCE;
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("en-US");

let lang = "en";
try { lang = localStorage.getItem("tp_lang") || "en"; } catch (e) {}
let shown = false;
const errKey = { user: null, pass: null };
let noticeKey = null;

function applyLang() {
  const s = STR[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = s.pageTitle;
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = s[el.dataset.i]; });
  $("user").placeholder = s.userPh;
  $("reveal").textContent = shown ? s.hide : s.show;
  $("reveal").setAttribute("aria-pressed", String(shown));
  $("lang").textContent = s.langBtn;
  $("submitLbl").textContent = $("submit").classList.contains("loading") ? s.busy : s.submit;
  $("userErr").textContent = errKey.user ? s[errKey.user] : "";
  $("passErr").textContent = errKey.pass ? s[errKey.pass] : "";
  $("notice").textContent = noticeKey ? s[noticeKey] : "";
}

function setErr(which, key) {
  errKey[which] = key;
  const field = $(which === "user" ? "fUser" : "fPass");
  const input = $(which);
  field.classList.toggle("bad", !!key);
  input.setAttribute("aria-invalid", String(!!key));
  $(which + "Err").textContent = key ? STR[lang][key] : "";
}

function shake(el) {
  if (!GS) return;
  gsap.to(el, { keyframes: [{ x: -6 }, { x: 6 }, { x: -4 }, { x: 4 }, { x: 0 }], duration: 0.4, ease: "none" });
}

function setBusy(on) {
  const b = $("submit");
  b.classList.toggle("loading", on);
  b.disabled = on;
  b.setAttribute("aria-busy", String(on));
  $("submitLbl").textContent = on ? STR[lang].busy : STR[lang].submit;
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const u = $("user").value.trim();
  const p = $("pass").value;
  setErr("user", u ? null : "errUser");
  setErr("pass", p ? null : "errPass");
  noticeKey = null;
  $("notice").textContent = "";
  if (!u || !p) {
    shake(!u ? $("fUser") : $("fPass"));
    (!u ? $("user") : $("pass")).focus();
    return;
  }
  setBusy(true);
  setTimeout(() => {
    setBusy(false);
    noticeKey = "notice";
    $("notice").textContent = STR[lang].notice;
    if (GS) gsap.fromTo("#notice", { autoAlpha: 0, y: -4 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power2.out" });
  }, 900);
});

$("reveal").addEventListener("click", () => {
  shown = !shown;
  $("pass").type = shown ? "text" : "password";
  applyLang();
});

$("lang").addEventListener("click", () => {
  lang = lang === "en" ? "ar" : "en";
  try { localStorage.setItem("tp_lang", lang); } catch (e) {}
  applyLang();
  if (GS) gsap.fromTo(".brand, .auth-body", { autoAlpha: 0.3 }, { autoAlpha: 1, duration: 0.4, ease: "power2.out" });
});

function intro() {
  const origin = lang === "ar" ? "right center" : "left center";
  const cnt = { v: 0 };
  $("totalNum").textContent = "0";
  const tl = gsap.timeline({ defaults: { ease: "power3.out" } });
  tl.from(".logo", { autoAlpha: 0, y: 10, duration: 0.6 })
    .from(".brand-title", { autoAlpha: 0, y: 22, duration: 0.9 }, "<0.1")
    .from(".hero-sub", { autoAlpha: 0, y: 14, duration: 0.8 }, "-=0.6")
    .from(".split-head", { autoAlpha: 0, y: 8, duration: 0.5 }, "-=0.4")
    .fromTo(".seg", { scaleX: 0, transformOrigin: origin }, { scaleX: 1, duration: 0.8, stagger: 0.14, ease: "power2.inOut" }, "-=0.2")
    .to(cnt, { v: 27500, duration: 1.1, ease: "power2.out", onUpdate() { $("totalNum").textContent = fmt(Math.round(cnt.v)); } }, "<")
    .from(".legend li", { autoAlpha: 0, y: 8, duration: 0.5, stagger: 0.08 }, "-=0.9")
    .fromTo(".sum .tick", { strokeDashoffset: 24 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, "-=0.2")
    .from(".rules li", { autoAlpha: 0, x: lang === "ar" ? 12 : -12, duration: 0.55, stagger: 0.1 }, "-=0.3")
    .from(".form-part > *", { autoAlpha: 0, y: 14, duration: 0.6, stagger: 0.07 }, "<0.1");
}

applyLang();
if (GS) intro();
</script>
</body>
</html>
