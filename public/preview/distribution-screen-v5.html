<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">

<title>Distribution Screen · v5</title>

<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#1b2430; --muted:#5f6977; --line:#e3e6eb;
  --brand:#0b4ea2; --brand-hover:#093f84; --ok:#1f8a4c; --ok-bg:#e7f5ec; --bad:#c62f2f; --bad-bg:#fbeaea;
  --warn:#8f5a00; --warn-bg:#fdf3e1; --chip:#eef2f7; --input:#ffffff; --grp:#e9eef6;
  --display:"Plus Jakarta Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161c; --panel:#1a2029; --ink:#e7ebf0; --muted:#a3adba; --line:#2b333f;
    --brand:#6aa5ff; --brand-hover:#8db9ff; --ok:#5fd08f; --ok-bg:#16301f; --bad:#ff7a7a; --bad-bg:#3a1c1c;
    --warn:#f2b45a; --warn-bg:#3a2c14; --chip:#232b36; --input:#11161d; --grp:#1f2836;
  }
}
html[dir=rtl]{--display:"IBM Plex Sans Arabic","Plus Jakarta Sans",system-ui,sans-serif;--body:"IBM Plex Sans Arabic","Plus Jakarta Sans",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);-webkit-font-smoothing:antialiased}
::selection{background:var(--grp);color:var(--ink)}
input{caret-color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.banner{background:var(--warn-bg);color:var(--warn);text-align:center;padding:6px 16px;font-size:12px}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header .logo{font-family:var(--display);font-weight:800;color:var(--brand);letter-spacing:-.01em}
header .crumbs{color:var(--muted)}
header .user{margin-inline-start:auto;color:var(--muted)}
.lang{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;transition:background-color .2s,border-color .2s}
.lang:hover{border-color:var(--brand)}
main{padding:16px 20px;max-width:1320px;margin:0 auto}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card .k{font-size:12px;color:var(--muted)}
.card .v{font-family:var(--display);font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.card .v small{font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted)}
.lock{font-size:11px;background:var(--chip);border-radius:4px;padding:1px 6px;margin-inline-start:6px;color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:8px 0 14px}
.legend b{color:var(--ink)}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.search{position:relative;flex:1 1 280px;max-width:420px}
.search input{width:100%;font:inherit;padding:8px 12px;padding-inline-start:32px;border:1px solid var(--line);border-radius:8px;background:var(--input);color:var(--ink);transition:border-color .2s,box-shadow .2s}
.search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent)}
.search svg{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer;font:inherit;transition:background-color .2s,color .2s,border-color .2s}
.tab:hover{border-color:var(--brand)}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.toolbar label{color:var(--muted);display:flex;align-items:center;gap:6px}
.toolbar .spacer{flex:1}
.btn{font:inherit;border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;transition:background-color .2s,border-color .2s,transform .15s}
.btn:not(:disabled):hover{border-color:var(--brand)}
.btn:not(:disabled):active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.btn.primary:not(:disabled):hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.link{border:none;background:none;color:var(--brand);padding:8px 6px}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:72vh;scrollbar-color:var(--line) transparent}
table{border-collapse:collapse;width:100%;min-width:1080px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:end;white-space:nowrap}
thead th{position:sticky;background:var(--panel);font-size:12px;color:var(--muted);font-weight:600;z-index:2}
thead tr.h1 th{top:0}
thead tr.h2 th{top:44px;padding-top:4px;padding-bottom:8px}
th.s,td.s{text-align:start}
th .sub{display:block;font-weight:400;font-size:11px}
.f{width:100%;min-width:70px;font:inherit;font-size:12px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:var(--ink);transition:border-color .2s,box-shadow .2s}
.f:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.f.num{text-align:end}
.f.on{border-color:var(--brand);outline:1px solid var(--brand)}
tr.grp td{background:var(--grp);font-weight:650;cursor:pointer;transition:background-color .2s}
tr.grp:hover td{background:color-mix(in srgb,var(--grp) 70%,var(--brand) 12%)}
tr.grp td.s{font-size:13px}
tr.grp.lvl1 td,tr.grp.lvl2 td{background:var(--chip);font-weight:600}
tr.grp.lvl2 td{font-weight:550}
tr.grp .caret{display:inline-block;width:14px;color:var(--muted)}
tr.grp .gsub{display:block;font-weight:500;font-size:11px;color:var(--muted)}
tr.grp .gsub.up{color:var(--ok)} tr.grp .gsub.down{color:var(--warn)}
td.pack{font-weight:600}
td.tgt{font-weight:650}
.cell{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.cell input{width:84px;text-align:end;font:inherit;font-variant-numeric:tabular-nums;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:var(--ink);transition:border-color .2s,box-shadow .2s}
.cell input:focus{outline:2px solid var(--brand);outline-offset:-1px}
.cell .d{font-size:11px;color:var(--muted)}
.cell .d.up{color:var(--ok)} .cell .d.down{color:var(--warn)}
.cell.over input{border-color:var(--bad);background:var(--bad-bg)}
.cell.over .d{color:var(--bad);font-weight:600}
.status{font-size:12px;border-radius:999px;padding:2px 9px;display:inline-block}
.status.ok{background:var(--ok-bg);color:var(--ok)}
.status.bad{background:var(--bad-bg);color:var(--bad)}
.mv{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.moved{font-size:12px;color:var(--muted)}
.moved.bad{color:var(--bad);font-weight:600}
.meter{position:relative;display:block;width:96px;height:4px;border-radius:99px;background:var(--chip);overflow:hidden}
.meter .fill{position:absolute;inset:0;background:var(--brand);transform-origin:left center;transform:scaleX(0);border-radius:99px}
html[dir=rtl] .meter .fill{transform-origin:right center}
.meter .fill.over{background:var(--bad)}
.reset{border:none;background:none;color:var(--brand);cursor:pointer;font:inherit;font-size:12px;border-radius:4px;padding:2px 4px}
.reset:hover{text-decoration:underline}
.foot{color:var(--muted);font-size:12px;margin-top:10px}
.empty{color:var(--muted);text-align:center;padding:30px}
.toast-wrap{position:fixed;inset-inline:0;bottom:20px;display:flex;justify-content:center;pointer-events:none;z-index:10}
.toast{background:var(--ink);color:var(--bg);font-size:13px;font-weight:500;padding:10px 16px;border-radius:10px;max-width:90vw;opacity:0;visibility:hidden}
.toast.show{opacity:1;visibility:visible}
@media (prefers-reduced-motion:reduce){
  .tab,.btn,.f,.cell input,.search input,.lang,tr.grp td{transition:none}
}
</style>
</head>

  let m;
  if ((m = expr.match(/^(-?\d+)-(-?\d+)$/))) return v>=+m[1] && v<=+m[2];
  if ((m = expr.match(/^(>=|<=|>|<|=)?(-?\d+)$/))) {
    const n=+m[2];
    switch(m[1]){case ">":return v>n;case "<":return v<n;case ">=":return v>=n;case "<=":return v<=n;default:return v===n;}
  }
  return true;
}

function check(p){
  const d = cur[p].map((v,i)=>v-start[p][i]);
  const sum = cur[p].reduce((a,b)=>a+b,0);
  const up = d.filter(x=>x>0).reduce((a,b)=>a+b,0);
  const down = -d.filter(x=>x<0).reduce((a,b)=>a+b,0);
  const moved = Math.max(up,down);
  const c = cap(p);
  const overPerson = d.map(x=>Math.abs(x)>c);
  let msg=null;
  if (sum!==target[p]) msg = (sum>target[p]?t("over"):t("short"))+fmt(Math.abs(sum-target[p]));
  else if (overPerson.some(Boolean)) msg = t("personCap");
  else if (moved>c) msg = t("movedTooMuch");
  return {d,moved,c,overPerson,ok:!msg,msg};
}

function visibleReps(){
  const s = q.trim().toLowerCase();
  if (!s) return reps.map((_,i)=>i);
  const hits = reps.map((r,i)=>(String(r.route).includes(s)||String(r.salesman).includes(s))?i:-1).filter(i=>i>=0);
  return hits.length ? hits : reps.map((_,i)=>i);
}
function repSearchHit(){
  const s=q.trim().toLowerCase();
  return !!s && reps.some(r=>String(r.route).includes(s)||String(r.salesman).includes(s));
}

function packPasses(p, vr){
  const r = check(p);
  const s = q.trim().toLowerCase();
  if (s && !repSearchHit() && !p.toLowerCase().includes(s)) return false;
  if (F.pack && !p.toLowerCase().includes(F.pack.toLowerCase())) return false;
  if (!numTest(F.tgt, target[p])) return false;
  for (const i of vr) if (!numTest(F.reps[i], cur[p][i])) return false;
  if (!numTest(F.moved, r.moved)) return false;
  if (F.status==="ok" && !r.ok) return false;
  if (F.status==="bad" && r.ok) return false;
  return true;
}

function renderHead(vr){
  $("head").innerHTML =
    `<th class="s">${t("pack")}</th><th>${t("tgt")}<span class="sub">${t("locked")}</span></th>` +
    vr.map(i=>`<th>${t("route")} ${reps[i].route}<span class="sub">${t("salesman")} ${reps[i].salesman}</span></th>`).join("") +
    `<th>${t("moved")}</th><th class="s">${t("status")}</th><th></th>`;
  const fx = (key, val, num) => `<th><input class="f ${num?"num":""} ${val?"on":""}" data-f="${key}" value="${val}" placeholder="${num?t("fNum"):t("fText")}"></th>`;
  $("filters").innerHTML =
    fx("pack",F.pack,false).replace("<th>",'<th class="s">') + fx("tgt",F.tgt,true) +
    vr.map(i=>fx("rep"+i,F.reps[i],true)).join("") + fx("moved",F.moved,true) +
    `<th class="s"><select class="f ${F.status!=="all"?"on":""}" data-f="status">
       <option value="all"${F.status==="all"?" selected":""}>${t("all")}</option>
       <option value="ok"${F.status==="ok"?" selected":""}>${t("ok")}</option>
       <option value="bad"${F.status==="bad"?" selected":""}>${t("problems")}</option></select></th><th></th>`;
}

const TREE = [
 {id:"CSD", kids:[
   {id:"SSNR", kids:[
     {id:"CANS", kids:["CSD_CANS150","CSD_CANS240","CSD_CANS250","CSD_CANS300","CSD_CANS320","CSD_CANS325","CSD_CANS330","CSD_CANS355","CSD_CANS360","STING_240"]},
     "CSD_NRB","STING_250","CSD_SSPET250","CSD_SSPET400"]},
   {id:"MSPET", kids:["CSD_PET1000", {id:"BIG MSPET", kids:["CSD_PET2000","CSD_PET2200","CSD_PET2250"]}]},
   "PMIX"]},
 {id:"Water", kids:["AquafinA_200","AquafinA_330","AquafinA_500","AquafinA_1500","AquafinA_Sparkling_250","AquafinA_NRB250","AquafinA_NRB750"]},
 {id:"LRB-Others", kids:[
   {id:"LIT", kids:["LIT_CANS150","LIT_CANS240","LIT_CANS320","LIT_CANS315","LIT_SSPET330","LIT_FSY"]},
   "GATORADE","MPLUS_NRB300","TROP_FRUTZ_CANS",
   {id:"ROCKSTAR", kids:["Rockstar_185","Rockstar_250"]},
   {id:"Sting Energy", kids:["Sting Energy_185","Sting Energy_240","Sting Energy_300"]},
   {id:"Britvic", kids:["Britvic_300","Britvic_Soda"]}]}
];
const leaves = n => typeof n==="string" ? [n] : n.kids.flatMap(leaves);
let tab = "all";
TREE.forEach(n=>{ n.kids = leaves(n); });

/* meter fill = moved / cap, clamped; a pack with no cap but moves is full */
function meterScale(p){
  const r = check(p);
  return r.c > 0 ? Math.min(r.moved / r.c, 1) : (r.moved > 0 ? 1 : 0);
}

function renderBody(){
  const vr = visibleReps();
  const hideZero = $("hideZero").checked;
  const cols = vr.length + 5;
  let html="";
  const keep = p => packs.includes(p) && !(hideZero && target[p]===0);
  const walk = (node, lvl) => {
    if (typeof node==="string"){
      const p=node; if (!keep(p) || !packPasses(p,vr)) return;
      const r = check(p);
      const over = r.moved > r.c;
      html += `<tr data-p="${p}"><td class="s pack" style="padding-inline-start:${16+lvl*18}px">${p}</td><td class="tgt">${fmt(target[p])}</td>` +
        vr.map(i=>{
          const v=cur[p][i], dd=r.d[i];
          const cls = r.overPerson[i]?"cell over":"cell";
          const dc = dd>0?"d up":dd<0?"d down":"d";
          const dt = dd===0?`${t("start")} ${fmt(start[p][i])}`:`${dd>0?"+":""}${fmt(dd)} ${t("from")} ${fmt(start[p][i])}`;
          return `<td><div class="${cls}"><input inputmode="numeric" data-i="${i}" value="${v}"><span class="${dc}">${dt}</span></div></td>`;
        }).join("") +
        `<td><div class="mv"><span class="moved ${over?"bad":""}">${fmt(r.moved)} / ${fmt(r.c)}</span><span class="meter"><span class="fill ${over?"over":""}" data-p="${p}"></span></span></div></td>` +
        `<td class="s"><span class="status ${r.ok?"ok":"bad"}">${r.ok?t("ok"):r.msg}</span></td>` +
        `<td><button class="reset" data-reset="${p}">${t("reset")}</button></td></tr>`;
      return;
    }
    const all = leaves(node).filter(keep);
    const shown = all.filter(p=>packPasses(p,vr));
    if (!shown.length) return;
    const g=node.id;
    const gt = all.reduce((a,p)=>a+target[p],0);
    const okN = all.filter(p=>check(p).ok).length;
    const caret = collapsed[g] ? (lang==="ar"?"◂":"▸") : "▾";
    const label = (lvl===0 ? T[lang].groups[g] : (lang==="ar"?"إجمالي ":"Total ")+g);
    html += `<tr class="grp lvl${lvl}" data-g="${g}"><td class="s" style="padding-inline-start:${10+lvl*18}px"><span class="caret">${caret}</span>${label}
              <span class="gsub">${shown.length} / ${all.length} ${t("shownLbl")}</span></td>
              <td>${fmt(gt)}</td>` +
      vr.map(i=>{
        const now = all.reduce((a,p)=>a+cur[p][i],0), st = all.reduce((a,p)=>a+start[p][i],0), d=now-st;
        return `<td>${fmt(now)}<span class="gsub ${d>0?"up":d<0?"down":""}">${d===0?t("start")+" "+fmt(st):(d>0?"+":"")+fmt(d)}</span></td>`;
      }).join("") +
      `<td></td><td class="s"><span class="status ${okN===all.length?"ok":"bad"}">${okN} / ${all.length} ${t("grpOk")}</span></td><td></td></tr>`;
    if (collapsed[g]) return;
    node.kids.forEach(k=>walk(k,lvl+1));
  };
  TREE.filter(n=>tab==="all"||n.id===tab).forEach(n=>walk(n,0));
  $("body").innerHTML = html || `<tr><td class="empty" colspan="${cols}">${t("nothing")}</td></tr>`;
  afterRender();
  summarize();
}

/* after each DOM rebuild: animate what changed, nothing else */
function afterRender(){
  const body = $("body");

  // moved-vs-cap meters glide from their previous position
  body.querySelectorAll(".fill").forEach(el=>{
    const p = el.dataset.p, to = meterScale(p), from = prevFill[p] ?? to;
    prevFill[p] = to;
    if (GS && from !== to) gsap.fromTo(el, {scaleX: from}, {scaleX: to, duration: 0.45, ease: "power2.out", overwrite: "auto"});
    else el.style.transform = `scaleX(${to})`;
  });

  // status badge pops when a pack flips between OK and problem
  body.querySelectorAll("tr[data-p]").forEach(tr=>{
    const p = tr.dataset.p, badge = tr.querySelector(".status");
    if (!badge) return;
    const ok = badge.classList.contains("ok");
    if (GS && prevStatus[p] !== undefined && prevStatus[p] !== ok)
      gsap.fromTo(badge, {scale: 0.8, autoAlpha: 0.3}, {scale: 1, autoAlpha: 1, duration: 0.45, ease: "power2.out"});
    prevStatus[p] = ok;
  });

  // a changed cell gets a short green halo so the edit is visible
  body.querySelectorAll("input[data-i]").forEach(inp=>{
    const p = inp.closest("tr").dataset.p, key = p + "|" + inp.dataset.i, v = inp.value;
    if (GS && prevVal[key] !== undefined && prevVal[key] !== v)
      gsap.fromTo(inp, {boxShadow: "0 0 0 3px rgba(31,138,76,.45)"}, {boxShadow: "0 0 0 0 rgba(31,138,76,0)", duration: 0.8, ease: "power2.out"});
    prevVal[key] = v;
  });

  // group toggles, tab switches and filter resets fade rows in once
  if (GS && pendingRowsIn)
    gsap.from(body.querySelectorAll("tr"), {autoAlpha: 0, y: -3, duration: 0.3, stagger: 0.012, ease: "power2.out", clearProps: "opacity,visibility,transform"});
  pendingRowsIn = false;
}

/* count-up for summary numbers; kills any running count first */
function countTo(el, value){
  if (el._tw) el._tw.kill();
  const from = el._v ?? 0;
  el._v = value;
  if (!GS || from === value){ el.textContent = fmt(value); return; }
  const o = {v: from};
  el._tw = gsap.to(o, {v: value, duration: 0.6, ease: "power2.out", onUpdate(){ el.textContent = fmt(Math.round(o.v)); }});
}

function summarize(){
  const all = packs.filter(p=>target[p]>0);
  const pass = all.filter(p=>check(p).ok).length;
  countTo($("sTotal"), packs.reduce((a,p)=>a+target[p],0));
  countTo($("sPassN"), pass);
  $("sPassOf").textContent = all.length;
  const btn = $("submitBtn"), ready = pass===all.length;
  btn.disabled = !ready;
  if (GS && ready && !submitWasReady)
    gsap.fromTo(btn, {scale: 0.96}, {scale: 1, duration: 0.5, ease: "power2.out", clearProps: "transform"});
  submitWasReady = ready;
}

function toast(msg){
  const el = $("toast");
  el.textContent = msg;
  if (!GS){
    el.classList.add("show");
    clearTimeout(el._h);
    el._h = setTimeout(()=>el.classList.remove("show"), 2600);
    return;
  }
  if (toastTl) toastTl.kill();
  toastTl = gsap.timeline()
    .fromTo(el, {autoAlpha: 0, y: 12}, {autoAlpha: 1, y: 0, duration: 0.35, ease: "power2.out"})
    .to(el, {autoAlpha: 0, y: 8, duration: 0.3, ease: "power2.in"}, "+=2.4");
}

function render(){ renderHead(visibleReps()); renderBody(); }

function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = t(el.dataset.t); });
  $("langBtn").textContent = t("langBtn");
  $("q").placeholder = t("search");
  $("foot").textContent = t("foot");
  render();
}

/* first paint: header, cards, rows enter in sequence */
function intro(){
  const tl = gsap.timeline({defaults:{ease:"power3.out"}});
  tl.from("header", {autoAlpha:0, y:-8, duration:0.5})
    .from(".banner", {autoAlpha:0, duration:0.4}, "<")
    .from(".summary .card", {autoAlpha:0, y:16, duration:0.6, stagger:0.07}, "-=0.25")
    .from(".legend span", {autoAlpha:0, duration:0.4, stagger:0.05}, "-=0.4")
    .from(".toolbar", {autoAlpha:0, y:8, duration:0.5, stagger:0.06}, "-=0.3")
    .from("#body tr", {autoAlpha:0, y:6, duration:0.4, stagger:0.018, clearProps:"opacity,visibility,transform"}, "-=0.2");
}

/* events */
$("body").addEventListener("change", e=>{
  if (e.target.tagName!=="INPUT") return;
  const p = e.target.closest("tr").dataset.p, i=+e.target.dataset.i;
  let v = parseInt(String(e.target.value).replace(/[^0-9]/g,""),10);
  if (isNaN(v)||v<0) v=0;
  cur[p][i]=v; renderBody();
});
$("body").addEventListener("click", e=>{
  const rp = e.target.dataset && e.target.dataset.reset;
  if (rp){ cur[rp]=start[rp].slice(); renderBody(); return; }
  const g = e.target.closest("tr.grp");
  if (g){ collapsed[g.dataset.g]=!collapsed[g.dataset.g]; pendingRowsIn=true; renderBody(); }
});
$("filters").addEventListener("input", e=>{
  const k=e.target.dataset.f; if(!k) return;
  if (k.startsWith("rep")) F.reps[+k.slice(3)] = e.target.value; else F[k]=e.target.value;
  e.target.classList.toggle("on", !!e.target.value && e.target.value!=="all");
  renderBody();
});
$("q").addEventListener("input", e=>{ q=e.target.value; render(); });
$("hideZero").onchange = renderBody;
const allIds=[];(function c(n){if(typeof n!=="string"){allIds.push(n.id);n.kids.forEach(c);}})({kids:TREE});
$("expandAll").onclick=()=>{allIds.forEach(g=>collapsed[g]=false); pendingRowsIn=true; renderBody();};
$("collapseAll").onclick=()=>{allIds.forEach(g=>collapsed[g]=true); pendingRowsIn=true; renderBody();};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); tab=b.dataset.g; pendingRowsIn=true; renderBody();
});
$("clearF").onclick=()=>{F.pack=F.tgt=F.moved="";F.status="all";F.reps=reps.map(()=> "");q="";$("q").value="";pendingRowsIn=true;render();};
$("langBtn").onclick=()=>{
  lang = lang==="en"?"ar":"en";
  try{localStorage.setItem("tp_lang",lang);}catch(e){}
  if (GS) gsap.fromTo("main", {autoAlpha:0.35}, {autoAlpha:1, duration:0.4, ease:"power2.out"});
  applyLang();
};
$("saveBtn").onclick=()=>{ $("foot").textContent=t("saved"); toast(t("saved")); };
$("submitBtn").onclick=()=>{ $("foot").textContent=t("submitted"); toast(t("submitted")); };

applyLang();
if (GS) intro();
</script>
</body>
</html>
